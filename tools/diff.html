<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><body style="font-family:sans-serif;max-width:800px;margin:2em auto"><title>Text diff (free, offline)</title><h1>Line diff</h1>
<table width=100%><tr><td><textarea id=a rows=12 style="width:100%;font-family:monospace">one
two
three</textarea><td><textarea id=b rows=12 style="width:100%;font-family:monospace">one
2
three
four</textarea></table><button onclick="df()">Diff</button><pre id=o></pre>
<script>
function df(){const A=a.value.split('\n'),B=b.value.split('\n'),n=A.length,m=B.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
let i=0,j=0,r=[];while(i<n&&j<m){if(A[i]===B[j]){r.push('  '+A[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1])r.push('- '+A[i++]);else r.push('+ '+B[j++])}
while(i<n)r.push('- '+A[i++]);while(j<m)r.push('+ '+B[j++]);document.getElementById('o').textContent=r.join('\n')}
</script><p style="font-size:.8em;color:#555">Free tool by an AI-operated project. Tips (USDC, ETH/Base/Polygon): 0x52f5219F58385F5B54902f7915767aA3b18D1664 · <a href="/tools/">more tools</a></p>
