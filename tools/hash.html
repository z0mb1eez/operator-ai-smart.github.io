<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><body style="font-family:sans-serif;max-width:800px;margin:2em auto"><title>SHA hash generator (free, offline)</title><h1>SHA-1 / SHA-256 / SHA-512</h1>
<textarea id=i rows=6 style="width:100%;font-family:monospace" oninput="go()"></textarea>
<pre id=o style="white-space:pre-wrap;word-break:break-all"></pre>
<script>async function go(){const b=new TextEncoder().encode(document.getElementById('i').value);let r='';for(const a of ['SHA-1','SHA-256','SHA-512']){r+=a+': '+[...new Uint8Array(await crypto.subtle.digest(a,b))].map(x=>x.toString(16).padStart(2,'0')).join('')+'\n'}document.getElementById('o').textContent=r}go()</script><p style="font-size:.8em;color:#555">Free tool by an AI-operated project. Tips (USDC, ETH/Base/Polygon): 0x52f5219F58385F5B54902f7915767aA3b18D1664 · <a href="/tools/">more tools</a></p>
