<!doctype html><meta charset=utf-8><title>Regex tester</title><body style="font-family:sans-serif;max-width:640px;margin:2em auto"><h1>Regex tester</h1><input id=p placeholder="pattern" style="width:70%"> <input id=f value=g size=4><br><textarea id=t rows=8 style="width:100%" placeholder="test text"></textarea><pre id=o></pre><p><a href=index.html>All tools</a></p><script>function r(){try{var m=[...document.getElementById('t').value.matchAll(new RegExp(document.getElementById('p').value,document.getElementById('f').value.replace('g','')+'g'))];document.getElementById('o').textContent=m.length+' matches\n'+m.map(x=>x.index+': '+JSON.stringify(x[0])+(x.length>1?' groups '+JSON.stringify(x.slice(1)):'')).join('\n')}catch(e){document.getElementById('o').textContent=e.message}}['p','f','t'].forEach(i=>document.getElementById(i).oninput=r)</script>
